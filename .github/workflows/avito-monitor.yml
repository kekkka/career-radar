
name: Avito Career Monitor

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: avito-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Find and send Avito vacancies
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          python3 -u - <<'PY'
          import os
          import re
          import json
          import time
          import unicodedata
          import urllib.request
          import urllib.error
          import urllib.robotparser

          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlparse

          BASE = "https://career.avito.com"
          AGENT = "CareerRadar"
          HISTORY = Path("data/avito_history.json")
          RECHECK = 86400

          history = json.loads(
              HISTORY.read_text(encoding="utf-8")
          )

          checked = history.setdefault("checked", {})
          sent = set(history.setdefault("sent", []))

          def save():
              history["sent"] = sorted(sent)
              HISTORY.write_text(
                  json.dumps(
                      history,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )

          robots = urllib.robotparser.RobotFileParser()
          robots.set_url(BASE + "/robots.txt")
          robots.read()

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = set()
                  self.title = ""
                  self.text = []
                  self.in_title = False
                  self.skip = 0

              def handle_starttag(self, tag, attrs):
                  if tag == "title":
                      self.in_title = True
                  if tag in ("script", "style"):
                      self.skip += 1
                  if tag == "a":
                      href = dict(attrs).get("href")
                      if href:
                          self.links.add(href)

              def handle_endtag(self, tag):
                  if tag == "title":
                      self.in_title = False
                  if tag in ("script", "style"):
                      self.skip = max(0, self.skip - 1)

              def handle_data(self, data):
                  if self.in_title:
                      self.title += data
                  if not self.skip and data.strip():
                      self.text.append(data.strip())

          def fetch(url):
              if not robots.can_fetch(AGENT, url):
                  raise RuntimeError("Restricted by robots.txt")

              time.sleep(3)

              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": AGENT}
              )

              with urllib.request.urlopen(
                  request, timeout=30
              ) as response:
                  parser = Parser()
                  parser.feed(response.read().decode(
                      "utf-8", errors="replace"
                  ))

              return parser

          def normalize(text):
              text = unicodedata.normalize("NFKC", text)
              text = text.lower().replace("ё", "е")
              return re.sub(r"[\W_]+", " ", text).strip()

          def classify(title, category):
              text = normalize(title)

              excluded = [
                  r"\b(senior|lead|principal|staff|head|cpo)\b",
                  r"\b(ведущий|старший|руководитель|директор)\b",
                  r"\bdata analyst\b",
                  r"\bаналитик\w*\s+данных\b",
                  r"\bразработчик\w*\b",
                  r"\bdeveloper\b",
                  r"\bengineer\b",
                  r"\bинженер\w*\b",
                  r"\bbi\b",
                  r"\bdata scientist\b",
                  r"\bproject manager\b",
                  r"\bменеджер\w*\s+проект",
                  r"\bменеджер\w*\s+по\s+управлению\s+проект",
                  r"\bсистемн\w*\s+аналитик",
                  r"\bбизнес\s+аналитик",
                  r"\bмаркетингов\w*\s+аналитик",
                  r"\bфинансов\w*\s+аналитик",
                  r"\b(system|business|marketing|financial)\s+analyst\b",
                  r"\bproduct marketing\b",
                  r"\bproduct designer\b",
                  r"\bдизайнер\w*\b"
              ]

              if any(re.search(p, text) for p in excluded):
                  return None

              analysts = [
                  r"\bproduct analyst\b",
                  r"\bproduct analytics\b",
                  r"\bпродуктов\w*\s+аналитик",
                  r"\bаналитик\w*\s+продукт",
                  r"\bпродакт\s+аналитик",
                  r"\bproduct analyst intern\b",
                  r"\bстажер\w*\s+продуктов\w*\s+аналитик"
              ]

              managers = [
                  r"\bproduct manager\b",
                  r"\bproduct owner\b",
                  r"\bproduct intern\b",
                  r"\bproduct assistant\b",
                  r"\bпродакт\b",
                  r"\bпродукт\w*\s+менеджер",
                  r"\bменеджер\w*\s+продукт",
                  r"\bменеджер\w*\s+по\s+продукт",
                  r"\bменеджер\w*\s+по\s+развитию\s+продукт",
                  r"\bвладелец\s+продукт",
                  r"\bapm\b"
              ]

              if any(re.search(p, text) for p in analysts):
                  return "Product Analytics"

              if any(re.search(p, text) for p in managers):
                  return "Product Management"

              if category == "upravlenie-produktom":
                  if re.search(r"\b(pm|po|tpm)\b", text):
                      return "Product Management"

              return None

          def send_message(text):
              token = os.environ["TELEGRAM_BOT_TOKEN"]

              payload = json.dumps({
                  "chat_id": os.environ["TELEGRAM_CHAT_ID"],
                  "text": text,
                  "disable_web_page_preview": True
              }).encode("utf-8")

              request = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data=payload,
                  headers={
                      "Content-Type": "application/json"
                  }
              )

              try:
                  with urllib.request.urlopen(
                      request, timeout=30
                  ) as response:
                      result = json.load(response)

                  if not result.get("ok"):
                      raise RuntimeError("Telegram rejected message")

              except urllib.error.HTTPError as error:
                  raise RuntimeError(
                      f"Telegram error: {error.code}"
                  ) from None

              except urllib.error.URLError:
                  raise RuntimeError(
                      "Telegram connection failed"
                  ) from None

              time.sleep(2)

          def collect_links(parser, source):
              result = set()

              for href in parser.links:
                  parsed = urlparse(urljoin(source, href))

                  if parsed.hostname == "career.avito.com":
                      result.add(
                          BASE + parsed.path.rstrip("/") + "/"
                      )

              return result

          vacancy_pattern = re.compile(
              r"/(?:publications|vacancies)/[^/]+/"
              r"(?:\d+|[a-fA-F0-9-]{36})/?"
          )

          catalog = BASE + "/publications/"
          links = collect_links(fetch(catalog), catalog)

          categories = {
              link for link in links
              if re.fullmatch(
                  r"/publications/[^/]+/",
                  urlparse(link).path
              )
          }

          vacancies = {
              link for link in links
              if vacancy_pattern.fullmatch(
                  urlparse(link).path
              )
          }

          for category in sorted(categories):
              print("Checking category:", category)

              found = collect_links(
                  fetch(category), category
              )

              vacancies.update({
                  link for link in found
                  if vacancy_pattern.fullmatch(
                      urlparse(link).path
                  )
              })

          if not vacancies:
              raise SystemExit("No vacancies found")

          print("TOTAL VACANCIES:", len(vacancies))

          processed = 0
          skipped = 0
          delivered = 0
          failures = 0

          for index, url in enumerate(sorted(vacancies), 1):
              job_id = url.rstrip("/").split("/")[-1]

              print(f"Progress: {index}/{len(vacancies)}")

              cached = checked.get(job_id, {})
              age = time.time() - cached.get("timestamp", 0)

              try:
                  if cached and age < RECHECK:
                      job = cached
                      skipped += 1
                  else:
                      page = fetch(url)
                      title = page.title.strip()

                      if not title:
                          raise RuntimeError("Missing title")

                      category = urlparse(url).path.split("/")[2]
                      role = classify(title, category)

                      text = normalize(" ".join(page.text))

                      internal = bool(re.search(
                          r"войдите как сотрудник|"
                          r"только для сотрудников|"
                          r"внутренняя вакансия",
                          text
                      ))

                      job = {
                          "title": title,
                          "role": role,
                          "internal": internal,
                          "timestamp": int(time.time())
                      }

                      checked[job_id] = job
                      processed += 1
                      save()

                  if not job.get("role"):
                      continue

                  if job_id in sent:
                      print("Already sent:", job["title"])
                      continue

                  access = (
                      "🔒 Возможно внутренняя вакансия. "
                      "Уточни возможность рекомендации."
                      if job["internal"]
                      else "Способ отклика: уточнить."
                  )

                  message = (
                      "Солнышко, я нашел тебе вакансию! 💗\n\n"
                      f"💼 {job['title']}\n\n"
                      "🏢 Компания: Авито\n"
                      f"📊 Направление: {job['role']}\n"
                      "⚠️ Требуемый опыт: уточнить\n\n"
                      f"{access}\n\n"
                      f"🔗 {url}\n\n"
                      "У тебя все получится! 🐱"
                  )

                  send_message(message)

                  sent.add(job_id)
                  delivered += 1
                  save()

                  print("SENT:", job["title"])

              except Exception as error:
                  failures += 1
                  print("ERROR:", url, type(error).__name__)

          save()

          print("Newly checked:", processed)
          print("Loaded from history:", skipped)
          print("New notifications:", delivered)
          print("Errors:", failures)
          print("MONITOR COMPLETED")

          if failures:
              raise SystemExit("Some vacancies failed")
          PY

      - name: Save vacancy history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/avito_history.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Avito vacancy history"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
