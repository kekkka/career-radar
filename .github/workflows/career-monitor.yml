
name: Career Monitor

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: career-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Check career sources
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python3 -u - <<'PY'
          import urllib.request
          import urllib.error
          import urllib.robotparser
          import re
          import time
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlparse

          AGENT = "CareerRadar"

          COMPANIES = {
              "Яндекс": {
                  "aliases": ["Yandex", "Яндекс"],
                  "career": [
                      "https://yandex.ru/jobs/vacancies"
                  ]
              },
              "Самокат": {
                  "aliases": ["Samokat", "Самокат", "Samokat Tech"],
                  "career": [
                      "https://vacancy.samokat.ru/"
                  ]
              },
              "ВкусВилл": {
                  "aliases": ["VkusVill", "ВкусВилл", "Вкус Вилл"],
                  "career": [
                      "https://vkusvill.ru/job/vacancys/"
                  ]
              },
              "Dodo Brands": {
                  "aliases": ["Dodo Brands", "Dodo", "Додо", "Dodo Engineering"],
                  "career": [
                      "https://dodoteam.ru/"
                  ]
              },
              "Т-Банк": {
                  "aliases": [
                      "Т-Банк", "Т Банк", "T-Bank",
                      "TBank", "Тинькофф", "Tinkoff"
                  ],
                  "career": [
                      "https://www.tbank.ru/career/vacancies/it/"
                  ]
              },
              "Точка": {
                  "aliases": ["Точка", "Tochka", "Точка Банк"],
                  "career": [
                      "https://hr.tochka.com/"
                  ]
              },
              "Авиасейлс": {
                  "aliases": ["Aviasales", "Авиасейлс", "Aviasales Tech"],
                  "career": [
                      "https://www.aviasales.ru/about/vacancies"
                  ]
              },
              "Циан": {
                  "aliases": ["Циан", "CIAN", "Cian Tech"],
                  "career": [
                      "https://www.cian.ru/career/vacancies/"
                  ]
              },
              "ЕАПТЕКА": {
                  "aliases": [
                      "ЕАПТЕКА", "Eapteka",
                      "Сбер Еаптека", "Е-Аптека"
                  ],
                  "career": [
                      "https://www.eapteka.ru/landing/vacancy/"
                  ]
              },
              "Skyeng": {
                  "aliases": ["Skyeng", "Скайенг", "Skyeng Tech"],
                  "career": [
                      "https://job.skyeng.ru/vacancies"
                  ]
              },
              "Кинопоиск": {
                  "aliases": ["Кинопоиск", "Kinopoisk", "КиноПоиск"],
                  "career": [
                      "https://yandex.ru/jobs/vacancies?services=kinopoisk"
                  ]
              },
              "START": {
                  "aliases": ["START", "Старт", "START Video"],
                  "career": [
                      "https://start.career/"
                  ]
              },
              "Wink": {
                  "aliases": ["Wink", "Винк", "Wink Video"],
                  "career": [
                      "https://job.rt.ru/"
                  ]
              }
          }

          
          # Updated sources after diagnostics

          COMPANIES["ВкусВилл"]["career"] = [
              "https://vkusvill.ru/job/office/"
          ]

          COMPANIES["START"]["career"] = [
              "https://start.career/career",
              "https://start.career/tech"
          ]

          COMPANIES["Wink"]["career"] = [
              "https://job.rt.ru/dzo",
              "https://job.rt.ru/search"
          ]

          COMPANIES["Skyeng"]["referral"] = [
              "https://referral-programs.skyeng.ru/"
          ]

          COMPANIES["Wink"]["telegram"] = [
              "https://t.me/Rostelecom_career"
          ]


          
          SOURCE_TYPES = [
              "career",
              "internal",
              "referral",
              "telegram",
              "linkedin",
              "recruiter"
          ]

          for company in COMPANIES.values():
              for source_type in SOURCE_TYPES:
                  company.setdefault(source_type, [])

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
                  self.text = []
                  self.href = None
                  self.anchor = []
                  self.skip = 0

              def handle_starttag(self, tag, attrs):
                  if tag in ("script", "style"):
                      self.skip += 1

                  if tag == "a":
                      self.href = dict(attrs).get("href")
                      self.anchor = []

              def handle_endtag(self, tag):
                  if tag in ("script", "style"):
                      self.skip = max(0, self.skip - 1)

                  if tag == "a":
                      if self.href:
                          self.links.append((
                              self.href,
                              " ".join(self.anchor)
                          ))

                      self.href = None
                      self.anchor = []

              def handle_data(self, data):
                  if not self.skip and data.strip():
                      self.text.append(data.strip())

                      if self.href:
                          self.anchor.append(data.strip())

          KEYWORDS = re.compile(
              r"vacanc|career|jobs|ваканси|"
              r"продакт|product|продукт|"
              r"аналитик|analyst|"
              r"стажиров|intern|junior|middle|"
              r"реферал|referral|"
              r"внутренн|internal|"
              r"показать ещё|показать еще",
              re.IGNORECASE
          )

          def fetch(url):
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": AGENT}
              )

              with urllib.request.urlopen(
                  request,
                  timeout=20
              ) as response:
                  body = response.read(
                      8 * 1024 * 1024
                  ).decode(
                      "utf-8",
                      errors="replace"
                  )

                  return (
                      response.status,
                      response.geturl(),
                      body
                  )

          def check_robots(url):
              parsed = urlparse(url)
              base = parsed.scheme + "://" + parsed.netloc

              robots = urllib.robotparser.RobotFileParser()
              robots.set_url(base + "/robots.txt")

              try:
                  _, _, body = fetch(base + "/robots.txt")
                  robots.parse(body.splitlines())

                  return robots.can_fetch(AGENT, url)

              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      return True

                  return False

              except Exception:
                  return False

          
          def is_vacancy(url):
              parsed = urlparse(url)
              host = parsed.netloc.lower()
              path = parsed.path.rstrip("/")

              if host == "yandex.ru":
                  return bool(re.fullmatch(
                      r"/jobs/vacancies/[^/]+-\d+",
                      path
                  ))

              if host in (
                  "aviasales.ru",
                  "www.aviasales.ru"
              ):
                  return bool(re.fullmatch(
                      r"/about/vacancies/\d+",
                      path
                  ))

              if host in (
                  "vkusvill.ru",
                  "www.vkusvill.ru"
              ):
                  return bool(re.fullmatch(
                      r"/job/vacancys/[^/]+\.html",
                      path
                  ))

              return False

          def classify(title):
              text = title.lower().replace("ё", "е")
              text = re.sub(r"[-–—]", " ", text)

              exclude = (
                  r"\bsenior\b|\blead\b|\bhead\b|"
                  r"\bprincipal\b|\bstaff\b|"
                  r"старший|ведущий|руководитель|"
                  r"product marketing|"
                  r"продуктов\w* маркетолог|"
                  r"product design|дизайнер|"
                  r"developer|разработчик|"
                  r"data engineer|"
                  r"data analyst|аналитик данных|"
                  r"business analyst|бизнес аналитик|"
                  r"system analyst|системный аналитик|"
                  r"project manager|менеджер проектов"
              )

              if re.search(exclude, text):
                  return None

              analyst = (
                  r"product analy(?:st|tics)|"
                  r"продуктов\w* аналитик|"
                  r"аналитик\w* продукт|"
                  r"аналитик\w* по продукт"
              )

              manager = (
                  r"product manager|"
                  r"product owner|"
                  r"product management|"
                  r"product intern|"
                  r"продакт|"
                  r"менеджер\w* продукта|"
                  r"менеджер\w* по продукт|"
                  r"продуктов\w* менеджер|"
                  r"менеджер\w* по развитию продукта|"
                  r"владелец продукта|\bapm\b"
              )

              if re.search(analyst, text):
                  return "Product Analyst"

              if re.search(manager, text):
                  return "Product Manager"

              return None
          
          def inspect_source(company, source_type, url):
              print("\n" + "=" * 60)
              print("COMPANY:", company)
              print("SOURCE TYPE:", source_type)
              print("URL:", url)

              try:
                  if not check_robots(url):
                      return "RESTRICTED OR UNVERIFIED", 0

                  time.sleep(3)

                  status, final_url, body = fetch(url)

                  if not check_robots(final_url):
                      return "REDIRECT RESTRICTED", 0

                  parser = Parser()
                  parser.feed(body)

                  found = set()

                  for href, title in parser.links:
                      full = urljoin(final_url, href)

                      if urlparse(full).scheme not in (
                          "http", "https"
                      ):
                          continue

                      if KEYWORDS.search(full + " " + title):
                          found.add((full, title[:200]))

                  print("HTTP STATUS:", status)
                  print("FINAL URL:", final_url)
                  print("HTML SIZE:", len(body))
                  print("TOTAL LINKS:", len(parser.links))
                  print("CANDIDATE LINKS:", len(found))

                  
                  for link, title in sorted(found):
                      print("LINK:", title, "|", link)

                  vacancy_count = 0
                  product_count = 0

                  for href, title in parser.links:
                      link = urljoin(final_url, href)

                      if not is_vacancy(link):
                          continue

                      vacancy_count += 1

                      role = classify(title)

                      if not role:
                          continue

                      product_count += 1

                      print(
                          "PRODUCT MATCH:",
                          company,
                          "|",
                          role,
                          "|",
                          title,
                          "|",
                          link
                      )

                  print("VACANCY CARDS:", vacancy_count)
                  print("PRODUCT MATCHES:", product_count)

                  print("RELEVANT TEXT:")

                  snippets = [
                      line for line in parser.text
                      if KEYWORDS.search(line)
                  ]

                  for line in snippets[:15]:
                      print(line[:250])

                  if found:
                      return "AVAILABLE", len(found)

                  return "NEEDS JS OR OTHER SOURCE", 0

              except Exception as error:
                  print(
                      "ERROR:",
                      type(error).__name__,
                      str(error)[:200]
                  )

                  return "NEEDS SEPARATE INTEGRATION", 0

          results = []

          print("CAREER RADAR")
          print("MODE: DIAGNOSTICS")
          print("TOTAL COMPANIES:", len(COMPANIES))

          for index, (company, config) in enumerate(
              COMPANIES.items(),
              start=1
          ):
              print(
                  "\nCOMPANY PROGRESS:",
                  f"{index}/{len(COMPANIES)}"
              )

              for source_type in SOURCE_TYPES:
                  for url in config[source_type]:
                      status, count = inspect_source(
                          company,
                          source_type,
                          url
                      )

                      results.append({
                          "company": company,
                          "source": source_type,
                          "status": status,
                          "links": count
                      })

          print("\n" + "=" * 60)
          print("FINAL REPORT")
          print("=" * 60)

          for item in results:
              print(
                  item["company"],
                  "|",
                  item["source"],
                  "|",
                  item["status"],
                  "| links:",
                  item["links"]
              )

          available = sum(
              item["status"] == "AVAILABLE"
              for item in results
          )

          print("\nTOTAL COMPANIES:", len(COMPANIES))
          print("CHECKED SOURCES:", len(results))
          print("AVAILABLE SOURCES:", available)
          print("NEED ADDITIONAL WORK:", len(results) - available)

          print("\nSOURCE CONFIGURATION:")

          for source_type in SOURCE_TYPES:
              count = sum(
                  len(config[source_type])
                  for config in COMPANIES.values()
              )

              print(source_type.upper(), ":", count)

          print("\nDIAGNOSTICS COMPLETED")
          PY
