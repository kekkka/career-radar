name: Career Monitor
on:
  workflow_dispatch:
    inputs:
      send_notifications:
        description: 'Send vacancy notifications to Telegram'
        type: boolean
        default: false
      linkedin_records:
        description: 'Public vacancy facts only; no email contents'
        type: string
        default: '[]'
      linkedin_only:
        description: 'Process LinkedIn batch without crawling sites'
        type: boolean
        default: false
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: write
concurrency:
  group: career-monitor
  cancel-in-progress: false
jobs:
  monitor:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Offline quality tests
        run: python3 -m unittest discover -s tests -v
      - name: Check career sources V1.2
        env:
          PYTHONUNBUFFERED: "1"
          LINKEDIN_RECORDS: ${{ inputs.linkedin_records }}
          LINKEDIN_ONLY: ${{ inputs.linkedin_only }}
          SEND_NOTIFICATIONS: ${{ github.event_name == 'schedule' || inputs.send_notifications }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AUTHORIZED_VACANCY_CHANNELS: ${{ vars.AUTHORIZED_VACANCY_CHANNELS }}
        run: |
          python3 -u - <<'PY'
          import urllib.request
          import urllib.error
          import urllib.robotparser
          import re
          import time
          import json
          import os
          import hashlib
          import html
          from pathlib import Path
          from collections import deque
          from urllib.parse import parse_qs, urlunparse, urlencode
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlparse

          AGENT = "CareerRadar"

          COMPANIES = {
              "Яндекс": {
                  "aliases": ["Yandex", "Яндекс"],
                  "career": [
                      "https://yandex.ru/jobs/vacancies"
                  ]
              },
              "Самокат": {
                  "aliases": ["Samokat", "Самокат", "Samokat Tech"],
                  "career": [
                      "https://vacancy.samokat.ru/"
                  ]
              },
              "ВкусВилл": {
                  "aliases": ["VkusVill", "ВкусВилл", "Вкус Вилл"],
                  "career": [
                      "https://vkusvill.ru/job/vacancys/"
                  ]
              },
              "Dodo Brands": {
                  "aliases": ["Dodo Brands", "Dodo", "Додо", "Dodo Engineering"],
                  "career": [
                      "https://dodoteam.ru/"
                  ]
              },
              "Т-Банк": {
                  "aliases": [
                      "Т-Банк", "Т Банк", "T-Bank",
                      "TBank", "Тинькофф", "Tinkoff"
                  ],
                  "career": [
                      "https://www.tbank.ru/career/vacancies/it/"
                  ]
              },
              "Точка": {
                  "aliases": ["Точка", "Tochka", "Точка Банк"],
                  "career": [
                      "https://hr.tochka.com/"
                  ]
              },
              "Авиасейлс": {
                  "aliases": ["Aviasales", "Авиасейлс", "Aviasales Tech"],
                  "career": [
                      "https://www.aviasales.ru/about/vacancies"
                  ]
              },
              "Циан": {
                  "aliases": ["Циан", "CIAN", "Cian Tech"],
                  "career": [
                      "https://www.cian.ru/career/vacancies/"
                  ]
              },
              "ЕАПТЕКА": {
                  "aliases": [
                      "ЕАПТЕКА", "Eapteka",
                      "Сбер Еаптека", "Е-Аптека"
                  ],
                  "career": [
                      "https://www.eapteka.ru/landing/vacancy/"
                  ]
              },
              "Skyeng": {
                  "aliases": ["Skyeng", "Скайенг", "Skyeng Tech"],
                  "career": [
                      "https://job.skyeng.ru/vacancies"
                  ]
              },
              "Кинопоиск": {
                  "aliases": ["Кинопоиск", "Kinopoisk", "КиноПоиск"],
                  "career": [
                      "https://yandex.ru/jobs/vacancies?services=kinopoisk"
                  ]
              },
              "START": {
                  "aliases": ["START", "Старт", "START Video"],
                  "career": [
                      "https://start.career/"
                  ]
              },
              "Wink": {
                  "aliases": ["Wink", "Винк", "Wink Video"],
                  "career": [
                      "https://job.rt.ru/"
                  ]
              }
          }


          # Updated sources after diagnostics


          COMPANIES["Яндекс"]["career"] = [
              "https://yandex.ru/jobs/vacancies",
              "https://yandex.ru/jobs/vacancies?professions=product-manager",
              "https://yandex.ru/jobs/vacancies?profession=analyst&profession=analyst-developer",
              "https://yandex.ru/jobs/vacancies?professions=product-manager&professions=project-manager-business&professions=tech-manager"
          ]

          COMPANIES["ВкусВилл"]["career"] = [
              "https://vkusvill.ru/job/office/"
          ]

          COMPANIES["START"]["career"] = [
              "https://start.career/career",
              "https://start.career/tech"
          ]

          COMPANIES["Wink"]["career"] = [
              "https://job.rt.ru/dzo",
              "https://job.rt.ru/search"
          ]

          COMPANIES["Skyeng"]["referral"] = [
              "https://referral-programs.skyeng.ru/"
          ]

          COMPANIES["Wink"]["telegram"] = [
              "https://t.me/Rostelecom_career"
          ]



          # Alternative public sources (availability still to be tested)
          COMPANIES["Самокат"]["career"].append("https://ecom.tech/vacancies")
          COMPANIES["Самокат"]["career"].append("https://ecom.tech/internships")
          COMPANIES["Dodo Brands"]["career"].append("https://dodoengineering.ru/")
          COMPANIES["Циан"]["career"].append("https://cian.huntflow.io/")
          COMPANIES["Точка"]["career"].append("https://hr.tochka.com/vacancies/")
          COMPANIES["Т-Банк"]["career"].append("https://www.tbank.ru/career/it/product-analytics/")

          # Additional public listing pages; live accessibility is not assumed.
          COMPANIES["Самокат"]["career"].extend(["https://samokat.tech/vacancies","https://samokat.tech/internships"])
          COMPANIES["Dodo Brands"]["career"].extend(["https://career.habr.com/companies/dododev","https://career.habr.com/companies/dodobrands"])
          COMPANIES["Skyeng"]["career"].extend(["https://job.skyeng.ru/vacancies-dev","https://vacancies.skyeng.ru/?ch=site","https://career.habr.com/companies/skyeng"])

          # Public source registry: discovery is not proof of permission or coverage.
          # No LinkedIn scraping; use official email alerts or explicitly submitted vacancies.
          CHANNELS = {
              'avito_career': 'Авито',
              'ya_jobs_pm': 'Яндекс',
              'dododev': 'Dodo Brands',
              'forproducts': '',
              'it_vakansii_jobs': '',
              'rostelecom_career': 'Wink',
          }
          # Bot API receives posts only from channels where administrators authorized the bot.
          # An explicit operator allowlist is additionally required; default is disabled.
          AUTHORIZED_CHANNELS = set(x.strip().lower().lstrip('@') for x in
                                    os.getenv('AUTHORIZED_VACANCY_CHANNELS', '').split(',') if x.strip())
          SOURCE_TYPES = [
              "career",
              "internal",
              "referral",
              "telegram",
              "linkedin",
              "recruiter"
          ]

          for company in COMPANIES.values():
              for source_type in SOURCE_TYPES:
                  company.setdefault(source_type, [])

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
                  self.text = []
                  self.href = None
                  self.anchor = []
                  self.skip = 0

              def handle_starttag(self, tag, attrs):
                  if tag in ("script", "style"):
                      self.skip += 1

                  if tag == "a":
                      self.href = dict(attrs).get("href")
                      self.anchor = []

              def handle_endtag(self, tag):
                  if tag in ("script", "style"):
                      self.skip = max(0, self.skip - 1)

                  if tag == "a":
                      if self.href:
                          self.links.append((
                              self.href,
                              " ".join(self.anchor)
                          ))

                      self.href = None
                      self.anchor = []

              def handle_data(self, data):
                  if not self.skip and data.strip():
                      self.text.append(data.strip())

                      if self.href:
                          self.anchor.append(data.strip())

          KEYWORDS = re.compile(
              r"vacanc|career|jobs|ваканси|"
              r"продакт|product|продукт|"
              r"аналитик|analyst|"
              r"стажиров|intern|junior|middle|"
              r"реферал|referral|"
              r"внутренн|internal|"
              r"показать ещё|показать еще",
              re.IGNORECASE
          )

          def is_vacancy(url):
              parsed = urlparse(url)
              host = parsed.netloc.lower()
              path = parsed.path.rstrip("/")

              if host == "yandex.ru":
                  return bool(re.fullmatch(
                      r"/jobs/vacancies/[^/]+-\d+",
                      path
                  ))

              if host in (
                  "aviasales.ru",
                  "www.aviasales.ru"
              ):
                  return bool(re.fullmatch(
                      r"/about/vacancies/\d+",
                      path
                  ))

              if host in (
                  "vkusvill.ru",
                  "www.vkusvill.ru"
              ):
                  return bool(re.fullmatch(
                      r"/job/vacancys/[^/]+\.html",
                      path
                  ))

              if host == "career.habr.com":
                  return bool(re.fullmatch(r"/vacancies/\d+",path))
              if host == "vacancies.skyeng.ru":
                  return bool(re.fullmatch(r"/vacancies/[^/]+",path))
              if host == "cian.huntflow.io":
                  return bool(re.fullmatch(r"/vacancy/[^/]+", path))
              if host == "hr.tochka.com":
                  return bool(re.fullmatch(r"/vacancies/catalog/[^/]+", path))
              if host in ("tbank.ru", "www.tbank.ru"):
                  return bool(re.fullmatch(r"/career/it/vacancy/.+/[0-9a-f-]{36}", path))
              return False

          def classify(title):
              text = title.lower().replace("ё", "е")
              text = re.sub(r"[-–—‑−]", " ", text)

              exclude = (
                  r"\bsenior\b|\blead\b|\bhead\b|"
                  r"\bprincipal\b|\bstaff\b|"
                  r"старший|ведущий|руководитель|"
                  r"product marketing|"
                  r"продуктов\w* маркетолог|"
                  r"product design|дизайнер|"
                  r"developer|разработчик|"
                  r"data engineer|\bbi\b|"
                  r"data\s+analyst|аналитик\w*\s+данных|"
                  r"business analyst|бизнес аналитик|"
                  r"system analyst|системный аналитик|"
                  r"project manager|менеджер проектов"
              )

              if re.search(exclude, text):
                  return None

              analyst = (
                  r"product analy(?:st|tics)|"
                  r"продуктов\w* аналитик|"
                  r"аналитик\w* продукт|"
                  r"аналитик\w* по продукт"
              )

              manager = (
                  r"product manager|"
                  r"product owner|"
                  r"product management intern|"
                  r"product intern|"
                  r"продакт|"
                  r"менеджер\w* продукта|"
                  r"менеджер\w* по продукт|"
                  r"продуктов\w* менеджер|"
                  r"менеджер\w* по развитию продукта|"
                  r"владелец продукта|\bapm\b"
              )

              if re.search(analyst, text):
                  return "Product Analyst"

              if re.search(manager, text):
                  return "Product Manager"

              return None



          # No cookies, login, access bypass or scraping of LinkedIn.
          # Check robots before each redirect and fail closed on unknown policy.
          robot_cache = {}
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect())

          from radar_quality import retry_fetch, identity_keys, source_status, daily_message
          retry_stats={'retries':0}
          def raw(url):
              def request():
                  req=urllib.request.Request(url,headers={"User-Agent":AGENT})
                  with opener.open(req,timeout=20) as response:
                      return response.read(8*1024*1024).decode("utf-8",errors="replace")
              return retry_fetch(request,retry_stats)

          def allowed(url):
              p = urlparse(url)
              if p.scheme != "https" or not p.hostname or p.username:
                  return False
              root = p.scheme + "://" + p.netloc
              if root not in robot_cache:
                  rp = urllib.robotparser.RobotFileParser()
                  try:
                      rp.parse(raw(root + "/robots.txt").splitlines())
                  except urllib.error.HTTPError as e:
                      if e.code == 404:
                          rp.parse([])
                      else:
                          print("ROBOTS HTTP STATUS:", root, e.code)
                          rp = None
                  except Exception as e:
                      print("ROBOTS FETCH ERROR:", root, type(e).__name__)
                      rp = None
                  robot_cache[root] = rp
              rp = robot_cache[root]
              return rp is not None and rp.can_fetch(AGENT, url)

          from radar_lifecycle import is_closed, vacancy_key, belongs_to_habr
          from functools import lru_cache
          @lru_cache(maxsize=32)
          def get_page(url):
              for _ in range(5):
                  if not allowed(url):
                      raise RuntimeError("ROBOTS RESTRICTED OR UNVERIFIED")
                  rp = robot_cache[urlparse(url).scheme + "://" + urlparse(url).netloc]
                  delay = rp.crawl_delay(AGENT) or rp.crawl_delay("*") or 3
                  rate = rp.request_rate(AGENT) or rp.request_rate("*")
                  if rate:
                      delay = max(delay, rate.seconds / rate.requests)
                  if delay > 30:
                      raise RuntimeError("CRAWL DELAY exceeds test budget")
                  time.sleep(max(3, delay))
                  try:
                      body = raw(url)
                      parser = Parser()
                      parser.feed(body)
                      return url, body, parser
                  except urllib.error.HTTPError as e:
                      if e.code in (301,302,303,307,308) and e.headers.get("Location"):
                          url = urljoin(url, e.headers["Location"])
                          continue
                      raise
              raise RuntimeError("Too many redirects")

          def canonical(url):
              return vacancy_key(url)

          def job_objects(body):
              def walk(obj):
                  if isinstance(obj, list):
                      for v in obj: yield from walk(v)
                  elif isinstance(obj, dict):
                      types = obj.get('@type', [])
                      if types == 'JobPosting' or isinstance(types,list) and 'JobPosting' in types:
                          yield obj
                      for v in obj.values():
                          if isinstance(v,(dict,list)): yield from walk(v)
              for m in re.finditer(r'<script\b[^>]*type=["\']application/ld\+json["\'][^>]*>(.*?)</script\s*>', body, re.I|re.S):
                  try: yield from walk(json.loads(m.group(1)))
                  except (ValueError,TypeError): continue

          from radar_experience import experience

          def priority(title, description):
              # Title and job description only; never infer B2C from employer name.
              t = re.sub(r'\s+', ' ', (title + ' ' + description).lower().replace('ё','е'))
              rules = {
                  'B2C': r'\bb2c\b|consumer[- ](?:facing|product|app|market)|массов\w*\s+(?:рынок|аудитори\w*|продукт\w*)|(?:для|среди)\s+(?:частных лиц|физических лиц|физлиц|конечных потребител\w*)|потребительск\w*\s+(?:продукт\w*|сервис\w*|приложени\w*)',
                  'Клиентский опыт (CX/UX)': r'клиентск\w*\s+(?:опыт\w*|путь|сценари\w*)|пользовательск\w*\s+(?:опыт\w*|путь|сценари\w*)|customer experience|user experience|customer journey|user journey|\bcjm\b|\b(?:cx|ux)\b|\b(?:nps|csat|ces)\b',
                  'Активация и удержание': r'\bonboarding\b|онбординг\w*|\bretention\b|удержани\w*\s+пользовател\w*|активаци\w*\s+пользовател\w*|\bactivation\b|\bchurn\b|отток\w*\s+пользовател\w*|лояльност\w*\s+клиент\w*',
                  'Клиентские сценарии': r'путь покупател\w*|оформлени\w*\s+заказ\w*|корзин\w*|\bcheckout\b|поиск\w*\s+товар\w*|персонализаци\w*|рекомендательн\w*\s+систем\w*|конверси\w*\s+(?:в покупку|в заказ|в оплату)|пользовательск\w*\s+воронк\w*',
              }
              tags=[]; evidence=[]
              for label, pattern in rules.items():
                  m=re.search(pattern,t)
                  if m:
                      tags.append(label); evidence.append(m.group(0))
              business=bool(re.search(r'\bb2b\b|\bb2e\b|\benterprise\b|внутренн\w*\s+(?:продукт\w*|сервис\w*|платформ\w*|инструмент\w*)|корпоративн\w*\s+(?:клиент\w*|продукт\w*)',t))
              explicit_b2c='B2C' in tags
              cx='Клиентский опыт (CX/UX)' in tags
              if business:
                  level=1 if explicit_b2c or cx else 0
              elif explicit_b2c or cx:
                  level=2
              elif tags:
                  level=1
              else:
                  level=0
              return level, tags, evidence, business
          history_path = Path('data/career_history.json')
          send_enabled = os.getenv('SEND_NOTIFICATIONS', '').lower() == 'true'
          history = json.loads(history_path.read_text()) if history_path.exists() else {'sent': []}
          sent = set(history['sent'])
          duplicates = 0
          notifications = 0
          send_errors = 0
          def format_notification(company, role, title, state, evidence, ranking, source='career'):
              esc = html.escape
              level, tags, signals, business = ranking
              lines = ['Котик, тут кое-что особенно интересное! 💕' if source == 'internal' else 'Солнышко, тебе тут новая вакансия! 💗', '', '<b>' + esc(company.upper()) + '</b>']
              if source == 'internal': lines.append('🔒 <b>ВНУТРЕННЯЯ ВАКАНСИЯ (по сообщению источника)</b>')
              if source == 'referral': lines.append('🤝 <b>РЕФЕРАЛЬНАЯ ВАКАНСИЯ (по сообщению источника)</b>')
              if level == 2: lines.append('🔥 <b>ВЫСОКИЙ ПРИОРИТЕТ — B2C / CX</b>')
              elif level == 1: lines.append('⭐ Возможный приоритет — уточнить контекст')
              lines.extend(['', '<b>' + esc(title[:350]) + '</b>', '', '👤 Направление: ' + esc(role)])
              match = re.fullmatch(r'([0-9.]+) years', evidence)
              if state == 'POSSIBLE_MATCH' and match:
                  n = float(match.group(1))
                  exp = 'без опыта' if n == 0 else f'от {n*12:g} мес.' if n < 1 else f'от {n:g} ' + ('года' if n in (1,2) else 'лет')
              else: exp = 'не подтверждён'
              lines.extend(['', '📊 Опыт: ' + esc(exp)])
              if tags: lines.extend(['', '🎯 Фокус: ' + esc(', '.join(tags))])
              labels = {'career':'🌐 Тип: публичная вакансия', 'internal':'📢 Источник: переданная внутренняя вакансия', 'referral':'📢 Источник: переданная реферальная вакансия', 'linkedin':'📢 Источник: переданное уведомление LinkedIn', 'telegram':'📢 Источник: переданная публикация Telegram'}
              lines.extend(['', labels.get(source,'📢 Источник: переданная вакансия'), '', '🤝 Свяжись со своим реферером и уточни возможность отклика.' if source in ('internal','referral') else '🤝 Реферальный отклик: уточнить'])
              return '\n'.join(lines)

          def telegram_api(method, data):
              token = os.environ.get('TELEGRAM_BOT_TOKEN','')
              if not token: raise RuntimeError('Telegram token missing')
              req = urllib.request.Request('https://api.telegram.org/bot'+token+'/'+method, data=json.dumps(data).encode(), headers={'Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=25) as response: result=json.load(response)
              if not result.get('ok'): raise RuntimeError('Telegram rejected request')
              return result['result']

          def save_history():
              history_path.parent.mkdir(parents=True,exist_ok=True)
              history['sent']=sorted(sent)
              history_path.write_text(json.dumps(history,indent=2)+'\n')

          def notify(company, role, title, link, state, evidence, ranking, source='career'):
              global notifications, send_errors, duplicates
              private = source != 'career'
              if state != 'POSSIBLE_MATCH':
                  print('HELD FOR EXPERIENCE REVIEW:',state, '' if private else link)
                  return True
              key=hashlib.sha256(canonical(link).encode()).hexdigest() if not private else hashlib.sha256(('submitted:'+company+':'+link+':'+title).encode()).hexdigest()
              keys=identity_keys(company,link)
              avito_path=Path('data/avito_history.json')
              avito_sent=set(json.loads(avito_path.read_text()).get('sent',[])) if avito_path.exists() else set()
              if key in sent or keys.intersection(sent) or any(k.startswith('avito:') and k[6:] in avito_sent for k in keys):
                  duplicates+=1
                  return True

              if not send_enabled: return False
              try:
                  telegram_api('sendMessage', {'chat_id':os.environ['TELEGRAM_CHAT_ID'],'text':format_notification(company,role,title,state,evidence,ranking,source),'parse_mode':'HTML','disable_web_page_preview':True,'reply_markup':{'inline_keyboard':[[{'text':'Открыть источник вакансии' if private else 'Открыть вакансию','url':link}]]}})
                  sent.update(keys); sent.add(key); save_history(); notifications+=1
                  print('SENT:',source if private else link)
                  time.sleep(1)
                  return True
              except Exception as e:
                  send_errors+=1; print('NOTIFICATION ERROR:',type(e).__name__); return False

          def parse_submission(text):
              # Explicit structured submission from the owner's private chat only.
              rows=text.splitlines()
              if not rows or rows[0].strip().lower()!='/vacancy': return None
              fields={}
              for line in rows[1:]:
                  k,sep,v=line.partition(':')
                  if sep: fields[k.strip().lower()]=v.strip()
              company=fields.get('компания','')
              source=fields.get('источник','').lower()
              title=fields.get('должность','')
              link=fields.get('ссылка','')
              desc=fields.get('описание','')
              if company not in set(COMPANIES)|{'Авито'} or source not in ('internal','referral','linkedin','telegram') or not title or not desc: return None
              u=urlparse(link)
              if u.scheme!='https' or not u.hostname or u.username or u.password: return None
              role=classify(title)
              if not role: return None
              state,evidence=experience(desc)
              return (company,role,title,link,state,evidence,priority(title,desc),source)

          def parse_channel_post(msg):
              # Only explicitly authorized public channel posts; never fetch private history.
              chat=msg.get('chat',{})
              channel=str(chat.get('username','')).lower()
              if chat.get('type')!='channel' or channel not in AUTHORIZED_CHANNELS or channel not in CHANNELS:
                  return None
              if not msg.get('date') or time.time()-msg['date']>7*86400:
                  return None
              body=msg.get('text') or msg.get('caption') or ''
              lines=[x.strip() for x in body.splitlines() if x.strip()]
              if not lines or len(lines)<2: return None
              # First line only: do not mistake requirements for a vacancy title.
              title=lines[0].strip(' 🔥🚀📌⭐➡️💻🔹❤️❣️')
              if len(title)>180 or re.search(r'подборк|несколько вакансий|топ вакансий|вакансии недели|дайджест',title,re.I):
                  return None
              role=classify(title)
              if not role: return None
              company=CHANNELS[channel]
              if not company:
                  # For shared channels, employer must occur in the title or explicit employer field.
                  identity=title+' '+ ' '.join(x for x in lines[1:5] if re.match(r'^(?:компания|работодатель|company|employer)\s*:',x,re.I))
                  names=[]
                  for c,cfg in dict(COMPANIES,Авито={'aliases':['Авито','Avito']}).items():
                      if any(re.search(r'(?<!\w)'+re.escape(a)+r'(?!\w)',identity,re.I) for a in cfg['aliases']):
                          names.append(c)
                  if len(names)!=1: return None
                  company=names[0]
              if company=='Wink' and not re.search(r'\bwink\b|винк',title,re.I): return None
              if company=='Яндекс' and re.search(r'кинопоиск|kinopoisk',title,re.I): company='Кинопоиск'
              state,evidence=experience(body)
              mid=msg.get('message_id')
              if not isinstance(mid,int) or mid<=0: return None
              return (company,role,title,f'https://t.me/{channel}/{mid}',state,evidence,priority(title,body),'telegram')
          def receive_submissions():
              if not send_enabled: return
              chat=os.environ.get('TELEGRAM_CHAT_ID','')
              if not chat.isdigit(): print('SUBMISSIONS: private owner chat required'); return
              try:
                  updates=telegram_api('getUpdates',{'offset':int(history.get('telegram_offset',0)), 'timeout':0,'limit':100,'allowed_updates':['message','channel_post']})
                  for update in updates:
                      if 'channel_post' in update:
                          job=parse_channel_post(update['channel_post'])
                          if job and not notify(*job): break
                      msg=update.get('message',{}); c=msg.get('chat',{})
                      if c.get('type')=='private' and str(c.get('id'))==chat and str(msg.get('from',{}).get('id'))==chat:
                          text=msg.get('text','')
                          if text.startswith('/vacancy'):
                              job=parse_submission(text)
                              if job:
                                  if not notify(*job): break
                                  if job[4]!='POSSIBLE_MATCH': telegram_api('sendMessage',{'chat_id':chat,'text':'Вакансия не отправлена в основную ленту: стаж выше лимита или не подтверждён.'})
                              else: telegram_api('sendMessage',{'chat_id':chat,'text':'Не удалось принять вакансию: проверь формат, компанию и должность.'})
                      history['telegram_offset']=update['update_id']+1; save_history()
                  print('SUBMISSIONS CHECKED:',len(updates))
              except Exception as e:
                  print('SUBMISSION ERROR:',type(e).__name__)

          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          def source_id(company,kind,url):
              return company+' | '+kind+' | '+hashlib.sha256(url.encode()).hexdigest()[:12]
          health={}
          seen_jobs=set(); outcomes={}; reports=[]; pending=[]
          MAX_PAGES=5
          MAX_DETAILS=30

          def inspect_source(company, source_type, url):
              print('\nCOMPANY:',company,'SOURCE:',source_type,'URL:',url)
              queue=deque([url]); pages=set(); cards=set(); matches=0; errors=0; details=0; limited=False
              while queue and len(pages)<MAX_PAGES:
                  current=queue.popleft()
                  if current in pages: continue
                  pages.add(current)
                  try: final, body, parser=get_page(current)
                  except Exception as e:
                      print('SOURCE ERROR:',type(e).__name__,str(e)[:180]); errors+=1; continue
                  print('PAGE:',final,'LINKS:',len(parser.links))
                  candidates=[]
                  for href,title in parser.links:
                      full=urljoin(final,href)
                      p=urlparse(full); f=urlparse(final)
                      if p.scheme!='https': continue
                      if is_vacancy(full): candidates.append((full,title))
                      if p.netloc==f.netloc and p.path.rstrip('/')==f.path.rstrip('/') and any(re.fullmatch(r'(?:page|pagen_\d+|p|offset)',k,re.I) for k in parse_qs(p.query)) and full not in pages:
                          queue.append(full)
                      # Avoid printing every navigation link.
                  for obj in job_objects(body):
                      link=urljoin(final,str(obj.get('url') or final)); title=str(obj.get('title') or '')
                      if urlparse(link).netloc==urlparse(final).netloc and title: candidates.append((link,title))
                  for link,title in candidates:
                      key=(company,canonical(link)); cards.add(key[1])
                      role=classify(title)
                      if not role or key in seen_jobs: continue
                      if source_type=='career' and identity_keys(company,link).intersection(sent):
                          continue
                      if details>=MAX_DETAILS:
                          limited=True; print('DETAIL LIMIT:',link); continue
                      if company=='Кинопоиск' and not re.search(r'кинопоиск|kinopoisk',title+' '+link,re.I):
                          print('SERVICE UNVERIFIED:',link); continue
                      if company=='Самокат' and urlparse(link).hostname in ('ecom.tech','samokat.tech') and not re.search(r'самокат|samokat',title+' '+link,re.I):
                          print('SERVICE UNVERIFIED:',link); continue
                      if company=='Wink' and not re.search(r'\bwink\b|винк',title+' '+link,re.I): continue
                      details+=1
                      desc_text = ""
                      try:
                          _,detail,dp=get_page(link)
                          objects=list(job_objects(detail)); txt=' '.join(dp.text)
                          if urlparse(link).hostname=='career.habr.com' and not belongs_to_habr(objects,COMPANIES[company]['aliases']):
                              limited=True; print('EMPLOYER UNVERIFIED:',link); continue
                          if is_closed(txt,objects):
                              outcomes[key]='CLOSED'; seen_jobs.add(key)
                              print('CLOSED VACANCY:',link); continue
                          if objects:
                              obj=objects[0]; actual_title=str(obj.get('title') or '').strip();
                              if actual_title:
                                  title=actual_title; role=classify(title)
                                  if not role: continue
                              desc=Parser(); desc.feed(str(obj.get('description') or '')); desc_text=' '.join(desc.text); txt=txt+' '+desc_text
                          else:
                              # Prefer an actual heading to the navigation/card tags.
                              headings=re.findall(r'<h1\b[^>]*>(.*?)</h1\s*>',detail,re.I|re.S)
                              for heading in headings:
                                  hp=Parser(); hp.feed(heading); candidate=' '.join(hp.text).strip()
                                  if classify(candidate): title=candidate; role=classify(candidate); break
                              desc_text=txt
                          state,evidence=experience(desc_text)
                      except Exception as e:
                          errors+=1
                          state,evidence='UNKNOWN',type(e).__name__
                      seen_jobs.add(key); matches+=1
                      outcomes[key]=state
                      print('PRODUCT MATCH:',company,'|',role,'|',title,'|',link)
                      print('EXPERIENCE:',state,'|',evidence,'|',link)
                      ranking=priority(title, desc_text)
                      print('PRIORITY:',ranking[0],'|',', '.join(ranking[1]),'|',', '.join(ranking[2]),'|',link)
                      if source_type == 'career':
                          pending.append((company, role, title, link, state, evidence, ranking))
              if queue: print('PAGE LIMIT: coverage partial')
              print('SOURCE RESULT:',company,source_type,'pages',len(pages),'cards',len(cards),'new matches',matches,'errors',errors)
              health[source_id(company,source_type,url)]=source_status(len(pages),len(cards),errors,bool(queue) or limited)
              reports.append((company,source_type,len(cards),matches,errors))

          assert classify('Junior Product Manager')=='Product Manager'
          assert classify('Продуктовый аналитик')=='Product Analyst'
          assert classify('Data Analyst') is None
          assert classify('Senior Product Manager') is None
          assert experience('Требуется опыт от трех лет')[0]=='REVIEW_3_PLUS'
          assert experience('Продуктовый опыт от 2 лет')[0]=='POSSIBLE_MATCH'
          assert canonical('https://example.com/job/123?utm_source=x') == 'https://example.com/job/123'
          assert experience('Работали менеджером продукта 3–5 лет, желательно с AI/ML')[0]=='REVIEW_3_PLUS'
          assert experience('Опыт 2–5 лет')[0]=='POSSIBLE_MATCH'
          assert experience('Опыт 1–3 года')[0]=='POSSIBLE_MATCH'
          assert experience('Опыт более двух лет')[0]=='REVIEW_3_PLUS'
          assert experience('Опыт 2,5 года')[0]=='REVIEW_3_PLUS'
          assert experience('Работали продактом три года')[0]=='REVIEW_3_PLUS'
          assert experience('3+ years of experience')[0]=='REVIEW_3_PLUS'
          assert experience('At least three years')[0]=='REVIEW_3_PLUS'
          assert experience('Опыт от 3 лет будет преимуществом')[0]=='UNKNOWN'
          assert experience('Без опыта')[0]=='POSSIBLE_MATCH'
          assert experience('Опыт работы 6 месяцев')[0]=='POSSIBLE_MATCH'
          assert experience('Описание недоступно')[0]=='UNKNOWN'
          assert experience('Опыт от 2 лет. Работали аналитиком 3 года')[0]=='REVIEW_3_PLUS'
          assert priority('Product Manager B2C','')[0]==2
          assert priority('Менеджер продукта','Улучшать клиентский опыт')[0]==2
          assert priority('Product Analyst','Customer journey and NPS')[0]==2
          assert priority('Product Manager','Удержание пользователей и онбординг')[0]==1
          assert priority('Product Manager','B2B enterprise customer experience')[0]==1
          assert priority('Product Manager','B2B internal platform')[0]==0
          assert priority('Product Manager','')[0]==0
          assert priority('Product Manager B2C','B2B and B2C')[0]==1
          assert classify('Аналитик данных с фокусом на AI в команду Trisigma') is None
          assert classify('BI Product Analyst') is None
          assert '<b>ЯНДЕКС</b>' in format_notification('Яндекс','Product Manager','A & B','POSSIBLE_MATCH','2 years',(2,['B2C'],[],False))
          assert 'ВНУТРЕННЯЯ ВАКАНСИЯ' in format_notification('Яндекс','Product Manager','A','POSSIBLE_MATCH','2 years',(2,[],[],False),'internal')
          assert parse_submission('/vacancy\nКомпания: Авито\nИсточник: internal\nДолжность: Product Manager\nСсылка: https://example.com/job\nОписание: Опыт от 2 лет')[4]=='POSSIBLE_MATCH'
          assert is_vacancy('https://cian.huntflow.io/vacancy/product-manager')
          assert not is_vacancy('https://cian.huntflow.io/')
          assert not is_vacancy('https://other.huntflow.io/vacancy/product-manager')
          assert parse_channel_post({'chat':{'type':'channel','username':'not_authorized'}}) is None
          saved_channels=AUTHORIZED_CHANNELS.copy()
          AUTHORIZED_CHANNELS.add('ya_jobs_pm')
          sample={'chat':{'type':'channel','username':'ya_jobs_pm'},'message_id':123,'date':int(time.time()),'text':'Менеджер продукта B2C\nОпыт от 2 лет'}
          assert parse_channel_post(sample)[0]=='Яндекс'
          assert parse_channel_post(sample)[4]=='POSSIBLE_MATCH'
          assert parse_channel_post(dict(sample,text='Senior Product Manager\nОпыт от 2 лет')) is None
          assert parse_channel_post(dict(sample,text='Менеджер продукта\nОпыт от 3 лет'))[4]=='REVIEW_3_PLUS'
          assert parse_channel_post(dict(sample,date=1)) is None
          AUTHORIZED_CHANNELS=saved_channels
          print('CHANNELS AUTHORIZED:',len(AUTHORIZED_CHANNELS.intersection(CHANNELS)))
          print('SELF TESTS PASSED')

          scan_started=time.monotonic()
          from linkedin_intake import linkedin_records
          linkedin_only=os.getenv('LINKEDIN_ONLY','').lower()=='true'
          records=linkedin_records(os.getenv('LINKEDIN_RECORDS',''),set(COMPANIES)|{'Авито'})
          print('LINKEDIN VALID RECORDS:',len(records))
          for company,title,link,years in records:
              role=classify(title)
              if role:
                  if send_enabled: notify(company,role,title,link,'POSSIBLE_MATCH',f'{years:g} years',priority(title,''),'linkedin')
                  else: print('LINKEDIN DRY RUN: eligible record')
          if not linkedin_only: receive_submissions()
          for company,config in ({} if linkedin_only else COMPANIES).items():
              for source_type in SOURCE_TYPES:
                  for url in config[source_type]:
                      if source_type=='telegram':
                          print('CHANNEL REFERENCE ONLY:',company,'Bot API authorization required')
                          continue
                      try: inspect_source(company,source_type,url)
                      except Exception as e:
                          print('UNEXPECTED SOURCE ERROR:',company,type(e).__name__)
                          reports.append((company,source_type,0,0,1))
                          health[source_id(company,source_type,url)]='ERROR'
          for job in sorted(pending, key=lambda job: job[-1][0], reverse=True):
              notify(*job)
          print('PRIORITY HIGH:',sum(job[-1][0]==2 for job in pending))
          print('PRIORITY POSSIBLE:',sum(job[-1][0]==1 for job in pending))
          print('FINAL REPORT')
          for item in reports: print(*item,sep=' | ')
          print('UNIQUE PRODUCT MATCHES:',len(outcomes))
          for status in ('POSSIBLE_MATCH','UNKNOWN','REVIEW_3_PLUS','CLOSED'):
              print(status, sum(v==status for v in outcomes.values()))
          print('ELIGIBLE NEW VACANCIES:',sum(job[4]=='POSSIBLE_MATCH' for job in pending))
          print('NOTIFICATIONS SENT:', notifications)
          print('ELAPSED SECONDS:',round(time.monotonic()-scan_started))
          for company in COMPANIES:
              rows=[r for r in reports if r[0]==company]
              print('COVERAGE:',company,'sources',len(rows),'cards',sum(r[2] for r in rows),'errors',sum(r[4] for r in rows))
          print('COVERAGE: Авито separate workflow; channel intake if authorized')
          print('LINKEDIN: validated public facts accepted via manual dispatch')
          print('INTERNAL: authorized submission only; private portal coverage not established')
          print('NOTIFICATION ERRORS:', send_errors)

          if send_enabled and linkedin_only:
              history['linkedin_diagnostics']={'at':datetime.now(timezone.utc).isoformat(),'records':len(records),'sent':notifications,'errors':send_errors}
              save_history()
          def read_avito_diagnostics():
              try:
                  return json.loads(Path('data/avito_history.json').read_text()).get('diagnostics',{})
              except (OSError,ValueError):
                  return {}
          # Daily report uses completed scans, not inferred coverage. No private vacancy text.
          if send_enabled and not linkedin_only:
              now=datetime.now(ZoneInfo('Europe/Riga'))
              day=now.date().isoformat()
              stats=history.setdefault('diagnostics',{})
              if stats.get('day')!=day:
                  stats={'day':day,'runs':0,'sent':0,'duplicates':0,'retries':0}
                  history['diagnostics']=stats
              stats['runs']+=1
              stats['sent']+=notifications
              stats['duplicates']+=duplicates
              stats['retries']+=retry_stats['retries']
              stats['latest_health']=health
              stats['page_cache_hits']=get_page.cache_info().hits
              stats['avito']=read_avito_diagnostics()
              stats['linkedin']=history.get('linkedin_diagnostics',{})
              if now.hour>=20 and history.get('daily_report_sent')!=day:
                  try:
                      telegram_api('sendMessage',{'chat_id':os.environ['TELEGRAM_CHAT_ID'],'text':daily_message(stats)})
                      history['daily_report_sent']=day
                  except Exception as e:
                      send_errors+=1; print('DAILY REPORT ERROR:',type(e).__name__)
              save_history()
          print('PAGE CACHE HITS:',get_page.cache_info().hits)
          print('DIAGNOSTICS COMPLETED')
          if send_errors: raise SystemExit(1)
          PY
      - name: Save public vacancy history
        if: always() && (github.event_name == 'schedule' || inputs.send_notifications)
        run: |
          if [ ! -f data/career_history.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/career_history.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update public career vacancy history'
          for attempt in 1 2 3; do
            git pull --rebase origin main || exit 1
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
