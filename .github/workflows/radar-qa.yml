name: Career Radar QA
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test quality helpers
        run: python3 -m unittest discover -s tests -v
      - name: Compile embedded Python
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          for path in Path('.github/workflows').glob('*monitor.yml'):
              src=path.read_text().split("python3 -u - <<'PY'\n",1)[1].split('\n          PY',1)[0]
              compile(textwrap.dedent(src),str(path),'exec')
              print('Compiled:',path)
          PY
