name: Career Radar QA
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test quality helpers
        run: python3 -m unittest discover -s tests -v
      - name: Gmail connector fixtures
        run: node -e "require('./gmail_connector.js').testFixtures()"
      - name: Compile embedded Python
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          import tempfile
          import os
          for path in Path('.github/workflows').glob('*monitor.yml'):
              src=path.read_text().split("python3 -u - <<'PY'\n",1)[1].split('\n          PY',1)[0]
              compile(textwrap.dedent(src),str(path),'exec')
              print('Compiled:',path)
              code=textwrap.dedent(src)
              marker="print('SELF TESTS PASSED')"
              assert marker in code, path
              prefix=code.split(marker,1)[0]+marker
              # Execute offline definitions and inline assertions without starting the crawler.
              old=os.getcwd()
              import sys
              sys.path.insert(0,old)
              with tempfile.TemporaryDirectory() as temp:
                  os.chdir(temp)
                  try:
                      Path('data').mkdir()
                      Path('data/avito_history.json').write_text('{"checked":{},"sent":[]}')
                      exec(compile(prefix,str(path),'exec'),{'__name__':'__main__'})
                  finally:
                      os.chdir(old)
              print('Inline tests passed:',path)
          PY
