
name: Test Avito Career

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-avito:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check Avito vacancies
        run: |
          python3 - <<'PY'
          import urllib.request
          import urllib.robotparser
          import re
          import time
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlparse

          BASE = "https://career.avito.com"
          AGENT = "CareerRadar"

          robots = urllib.robotparser.RobotFileParser()
          robots.set_url(BASE + "/robots.txt")
          robots.read()

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls = set()

              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      href = dict(attrs).get("href")
                      if href:
                          self.urls.add(href)

          def fetch(url):
              if not robots.can_fetch(AGENT, url):
                  raise RuntimeError("Restricted by robots.txt")

              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": AGENT}
              )

              with urllib.request.urlopen(
                  request, timeout=30
              ) as response:
                  print("HTTP:", response.status, url)
                  body = response.read().decode(
                      "utf-8", errors="replace"
                  )
                  parser = Links()
                  parser.feed(body)

              result = set()

              for href in parser.urls:
                  full = urljoin(url, href)
                  parsed = urlparse(full)

                  if parsed.hostname != "career.avito.com":
                      continue

                  result.add(
                      BASE + parsed.path.rstrip("/") + "/"
                  )

              return result

          pattern = re.compile(
              r"/(?:publications|vacancies)/[^/]+/"
              r"(?:\d+|[a-fA-F0-9]{8}-"
              r"[a-fA-F0-9]{4}-"
              r"[a-fA-F0-9]{4}-"
              r"[a-fA-F0-9]{4}-"
              r"[a-fA-F0-9]{12})/?"
          )

          catalog = BASE + "/publications/"
          links = fetch(catalog)

          categories = {
              link for link in links
              if re.fullmatch(
                  r"/publications/[^/]+/",
                  urlparse(link).path
              )
          }

          categories.update({
              BASE + "/publications/upravlenie-produktom/",
              BASE + "/publications/analitika-dannykh/"
          })

          vacancies = {
              link for link in links
              if pattern.fullmatch(urlparse(link).path)
          }

          print("Catalog links:", len(links))
          print("Categories:", len(categories))

          errors = []

          for category in sorted(categories):
              try:
                  time.sleep(2)
                  found = fetch(category)

                  jobs = {
                      link for link in found
                      if pattern.fullmatch(
                          urlparse(link).path
                      )
                  }

                  vacancies.update(jobs)
                  print("Vacancies:", len(jobs), category)

              except Exception as error:
                  errors.append(category)
                  print("Category error:", category, error)

          print("TOTAL VACANCIES:", len(vacancies))
          print("FAILED CATEGORIES:", len(errors))

          for vacancy in sorted(vacancies):
              print(vacancy)

          if not vacancies:
              raise SystemExit("No vacancies found")

          if errors:
              raise SystemExit("Some categories failed")

          print("Avito connection successful!")
          PY
