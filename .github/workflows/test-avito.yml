
name: Test Avito Career

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-avito:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check Avito vacancies
        run: |
          python3 - <<'PY'
          import urllib.request
          import urllib.robotparser
          import re
          import html
          from urllib.parse import urljoin, urlparse

          base = "https://career.avito.com"
          agent = "CareerRadar"
          url = base + "/publications/"

          robots = urllib.robotparser.RobotFileParser()
          robots.set_url(base + "/robots.txt")
          robots.read()

          if not robots.can_fetch(agent, url):
              raise SystemExit("Access restricted by robots.txt")

          request = urllib.request.Request(
              url,
              headers={"User-Agent": agent}
          )

          with urllib.request.urlopen(
              request, timeout=30
          ) as response:
              print("HTTP status:", response.status)
              body = response.read().decode(
                  "utf-8", errors="replace"
              )

          links = re.findall(
              r'href=["\']([^"\']+)["\']',
              body
          )

          vacancies = set()

          for link in links:
              full = urljoin(url, html.unescape(link))
              parsed = urlparse(full)

              if parsed.hostname != "career.avito.com":
                  continue

              if re.fullmatch(
                  r"/(?:vacancies|publications)/"
                  r"[^/]+/\d+/?",
                  parsed.path
              ):
                  vacancies.add(
                      base + parsed.path.rstrip("/") + "/"
                  )

          print("Total vacancy links:", len(vacancies))

          for vacancy in sorted(vacancies):
              print(vacancy)

          if not vacancies:
              raise SystemExit("No vacancy links found")

          print("Avito connection successful!")
          PY
