
name: Test Avito Browser

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install browser
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium

      - name: Check vacancy content
        run: |
          python3 - <<'PY'
          import re
          import urllib.robotparser
          from playwright.sync_api import sync_playwright

          BASE = "https://career.avito.com"
          AGENT = "CareerRadar"

          URL = (
              BASE + "/publications/upravlenie-produktom/"
              "8fc055be-22d5-4ea4-be82-ada9f7420b01/"
          )

          robots = urllib.robotparser.RobotFileParser()
          robots.set_url(BASE + "/robots.txt")
          robots.read()

          if not robots.can_fetch(AGENT, URL):
              raise SystemExit("Access restricted by robots.txt")

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)

              page = browser.new_page(
                  locale="ru-RU",
                  user_agent=AGENT
              )

              response = page.goto(
                  URL,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              print("HTTP STATUS:", response.status)

              if response.status >= 400:
                  raise SystemExit("Page unavailable")

              page.wait_for_timeout(10000)

              for _ in range(6):
                  page.mouse.wheel(0, 700)
                  page.wait_for_timeout(1500)

              text = page.locator("body").inner_text()
              title = page.title()

              print("VACANCY:", title)

              markers = [
                  "О команде",
                  "Команда Support Automation развивает",
                  "Вам предстоит",
                  "Вам нужно будет",
                  "Мы ждём",
                  "Мы ждем",
                  "Требования",
                  "Что мы ожидаем",
                  "Чем предстоит заниматься"
              ]

              found = []

              for marker in markers:
                  if marker.lower() in text.lower():
                      found.append(marker)

              print("DESCRIPTION MARKERS:", found)

              lines = [
                  line.strip()
                  for line in text.splitlines()
                  if line.strip()
              ]

              start = None

              for i, line in enumerate(lines):
                  if any(
                      marker.lower() in line.lower()
                      for marker in markers
                  ):
                      start = i
                      break

              if start is not None:
                  print("DESCRIPTION FOUND: YES")

                  for line in lines[start:]:
                      if line.lower() == "похожие вакансии":
                          break
                      print(line)

              else:
                  print("DESCRIPTION FOUND: NO")

              print("EXPERIENCE REQUIREMENTS:")

              if start is not None:
                  for line in lines[start:]:
                      if line.lower() == "похожие вакансии":
                          break

                      if re.search(
                          r"опыт|стаж|experience",
                          line,
                          re.IGNORECASE
                      ):
                          print(line)
              else:
                  print("Experience unknown")

              employee_login = bool(re.search(
                  r"войдите как сотрудник",
                  text,
                  re.IGNORECASE
              ))

              print("EMPLOYEE LOGIN NOTICE:", employee_login)

              browser.close()

          print("DIAGNOSTICS COMPLETED")
          PY
