name: Career Radar Live Audit
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/radar-live-audit.yml'
      - '.github/workflows/career-monitor.yml'
      - '.github/workflows/avito-monitor.yml'
      - 'radar_rss.py'
      - 'radar_quality.py'
      - 'radar_experience.py'
      - 'radar_lifecycle.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: career-radar-live-audit
  cancel-in-progress: false
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        monitor: [career-monitor, avito-monitor]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public source dry run (no notifications)
        env:
          MONITOR: ${{ matrix.monitor }}
          SEND_NOTIFICATIONS: 'false'
          LINKEDIN_ONLY: 'false'
          LINKEDIN_RECORDS: '[]'
          AUTHORIZED_VACANCY_CHANNELS: ''
          PYTHONUNBUFFERED: '1'
        run: |
          python3 -u - <<'PY'
          import textwrap, tempfile, shutil, sys, os
          from pathlib import Path
          os.environ.pop('TELEGRAM_BOT_TOKEN',None)
          os.environ.pop('TELEGRAM_CHAT_ID',None)
          root=Path.cwd()
          sys.path.insert(0,str(root))
          path=root/'.github/workflows'/(os.environ['MONITOR']+'.yml')
          code=path.read_text().split("python3 -u - <<'PY'\n",1)[1].split('\n          PY',1)[0]
          with tempfile.TemporaryDirectory() as temp:
              shutil.copytree(root/'data',Path(temp)/'data')
              os.chdir(temp)
              try:
                  exec(compile(textwrap.dedent(code),str(path),'exec'),{'__name__':'__main__'})
              finally:
                  os.chdir(root)
          PY
      - name: Confirm histories unchanged
        if: always()
        run: git diff --exit-code -- data/
