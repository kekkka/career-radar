name: Telegram Delivery Verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/telegram-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify real Telegram delivery
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          token=os.environ.get('TELEGRAM_BOT_TOKEN','')
          chat=os.environ.get('TELEGRAM_CHAT_ID','')
          if not token or not chat:
              raise SystemExit('Telegram credentials missing')
          payload={'chat_id':chat,'text':'Career Radar на связи! 💗\nЭто контрольное сообщение: проверяем доставку в Telegram.\n/start и /status обрабатываются при очередном запуске мониторинга.'}
          req=urllib.request.Request('https://api.telegram.org/bot'+token+'/sendMessage',data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'})
          try:
              with urllib.request.urlopen(req,timeout=20) as response:
                  result=json.load(response)
              if not result.get('ok'): raise RuntimeError('Telegram rejected message')
          except Exception as e:
              raise SystemExit('Telegram delivery failed: '+type(e).__name__) from None
          print('TELEGRAM DELIVERY CONFIRMED')
          PY
