
name: Test Telegram Bot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-telegram:
    runs-on: ubuntu-latest

    steps:
      - name: Send test message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          message = (
              "Привет, солнышко! 💗\n\n"
              "Я наконец-то заработал!\n"
              "Совсем скоро начну искать для тебя "
              "самые классные вакансии.\n\n"
              "Ты строишь карьеру, а я ищу "
              "для тебя возможности! 🐱"
          )

          data = json.dumps({
              "chat_id": chat_id,
              "text": message
          }).encode("utf-8")

          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=data,
              headers={"Content-Type": "application/json"}
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
              if not result.get("ok"):
                  raise SystemExit("Telegram rejected the message")
              print("Message sent successfully!")
          except urllib.error.HTTPError as error:
              raise SystemExit(f"Telegram API error: {error.code}")
          except urllib.error.URLError:
              raise SystemExit("Telegram connection failed")
          PY
