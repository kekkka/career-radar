
name: Test Avito Vacancy Details

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-details:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Read vacancy descriptions
        run: |
          python3 - <<'PY'
          import urllib.request
          import urllib.robotparser
          import re
          import time
          from html.parser import HTMLParser
          from urllib.parse import urljoin

          BASE = "https://career.avito.com"
          AGENT = "CareerRadar"

          robots = urllib.robotparser.RobotFileParser()
          robots.set_url(BASE + "/robots.txt")
          robots.read()

          class PageParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
                  self.text = []
                  self.skip = 0

              def handle_starttag(self, tag, attrs):
                  if tag in ("script", "style"):
                      self.skip += 1
                  if tag == "a":
                      href = dict(attrs).get("href")
                      if href:
                          self.links.append(href)

              def handle_endtag(self, tag):
                  if tag in ("script", "style"):
                      self.skip = max(0, self.skip - 1)

              def handle_data(self, data):
                  if not self.skip and data.strip():
                      self.text.append(data.strip())

          def fetch(url):
              if not robots.can_fetch(AGENT, url):
                  raise RuntimeError("Restricted by robots.txt")

              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": AGENT}
              )

              with urllib.request.urlopen(
                  req, timeout=30
              ) as response:
                  parser = PageParser()
                  parser.feed(
                      response.read().decode(
                          "utf-8", errors="replace"
                      )
                  )
                  return parser

          categories = [
              "/publications/upravlenie-produktom/",
              "/publications/analitika-dannykh/"
          ]

          for category in categories:
              page = fetch(BASE + category)
              vacancies = set()

              for href in page.links:
                  url = urljoin(BASE, href)

                  if re.fullmatch(
                      r"https://career\.avito\.com"
                      r"/(?:publications|vacancies)/"
                      r"[^/]+/[a-fA-F0-9-]+/?",
                      url
                  ):
                      vacancies.add(url)

              print("CATEGORY:", category)
              print("FOUND:", len(vacancies))

              if not vacancies:
                  raise SystemExit("No vacancy links")

              for url in sorted(vacancies)[:2]:
                  time.sleep(3)
                  vacancy = fetch(url)

                  print("=" * 60)
                  print("VACANCY URL:", url)
                  print("EXTRACTED TEXT:")
                  print("\n".join(vacancy.text)[:18000])
                  print("=" * 60)

          print("DETAIL TEST COMPLETED")
          PY
